<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="Your life in days — a calendar of every day you have lived and every day you have left." />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#f6f6f8" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0b0b0f" media="(prefers-color-scheme: dark)" />
  <link rel="shortcut icon" href="./favicon.ico" type="image/x-icon" />
  <link rel="stylesheet" href="./src/styles/tokens.css" />
  <link rel="stylesheet" href="./src/styles/base.css" />
  <link rel="stylesheet" href="./src/styles/app.css" />
  <link rel="stylesheet" href="./src/styles/calendar.css" />
  <link rel="stylesheet" href="./src/styles/panel.css" />
  <title>Life Calendar</title>
  <script type="module" src="./src/scripts/main.js"></script>
</head>

<body>
  <a class="skip-link" href="#calendar" data-i18n="skipToCalendar">跳到日历</a>

  <header class="topbar">
    <div class="topbar__inner">
      <div class="topbar__row">
        <div class="brand">
          <span class="brand__mark" aria-hidden="true"></span>
          <h1 class="brand__title">Life Calendar</h1>
        </div>

        <div class="searchbar">
          <svg class="searchbar__icon icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="11" cy="11" r="6.4" />
            <path d="m15.8 15.8 4 4" />
          </svg>
          <input type="search" id="search-input" class="searchbar__input" autocomplete="off" spellcheck="false"
            data-i18n-placeholder="searchPlaceholder" placeholder="搜索这些年的记录…" />
          <span class="searchbar__count" id="search-count" aria-live="polite"></span>
          <div class="searchbar__nav" id="search-nav" hidden>
            <button type="button" class="icon-btn icon-btn--sm" id="search-prev" aria-label="上一个结果">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="m7 14 5-5 5 5" />
              </svg>
            </button>
            <button type="button" class="icon-btn icon-btn--sm" id="search-next" aria-label="下一个结果">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="m7 10 5 5 5-5" />
              </svg>
            </button>
          </div>
        </div>

        <div class="toolbar" role="toolbar" aria-label="Settings">
          <div class="segmented" role="group" data-i18n-label="density" aria-label="格子大小">
            <button type="button" class="segmented__btn" data-density="0" aria-pressed="true">S</button>
            <button type="button" class="segmented__btn" data-density="1" aria-pressed="false">M</button>
            <button type="button" class="segmented__btn" data-density="2" aria-pressed="false">L</button>
          </div>

          <button type="button" class="icon-btn" id="theme-btn" data-i18n-label="theme" aria-label="切换主题">
            <svg class="icon icon--sun" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="4.2" />
              <path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4" />
            </svg>
            <svg class="icon icon--moon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20 14.2A8.2 8.2 0 0 1 9.8 4a8.2 8.2 0 1 0 10.2 10.2Z" />
            </svg>
            <svg class="icon icon--auto" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="8.4" />
              <path d="M12 3.6v16.8A8.4 8.4 0 0 0 12 3.6Z" fill="currentColor" stroke="none" />
            </svg>
          </button>

          <button type="button" class="icon-btn" id="lock-btn" data-i18n-label="password" aria-label="解密口令">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="4.5" y="10.5" width="15" height="10" rx="2.4" />
              <path d="M8 10.5V7.8a4 4 0 0 1 8 0v2.7" />
            </svg>
          </button>
        </div>
      </div>

      <p class="motto" id="motto"></p>

      <div class="lifebar" id="lifebar">
        <div class="lifebar__track">
          <div class="lifebar__fill" id="lifebar-fill"></div>
          <div class="lifebar__ticks" id="lifebar-ticks" aria-hidden="true"></div>
        </div>
        <dl class="stats" id="stats"></dl>
      </div>

    </div>
  </header>

  <main id="calendar" class="calendar" aria-busy="true">
    <p class="placeholder" id="placeholder" data-i18n="loading">正在读取这一生…</p>
  </main>

  <footer class="footer">
    <p class="legend" id="legend"></p>
    <p class="footer__keys" data-i18n="keyHints">
      <kbd>t</kbd> 今天 · <kbd>/</kbd> 搜索 · <kbd>↑</kbd><kbd>↓</kbd> 前后一天 · <kbd>←</kbd><kbd>→</kbd> 前后一周 · <kbd>Esc</kbd> 关闭
    </p>
    <p class="footer__note">
      <span data-i18n="footerNote">灵感来自</span>
      <a href="https://waitbutwhy.com/2014/05/life-weeks.html" target="_blank" rel="noopener">Your Life in Weeks</a>
      ·
      <a href="https://github.com/ssine/LifeCalendar" target="_blank" rel="noopener">GitHub</a>
    </p>
  </footer>

  <button type="button" class="fab" id="today-btn" data-i18n-label="jumpToday" aria-label="回到今天">
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="12" r="7.5" />
      <circle cx="12" cy="12" r="2.4" fill="currentColor" stroke="none" />
      <path d="M12 1.8v2.6M12 19.6v2.6M1.8 12h2.6M19.6 12h2.6" />
    </svg>
  </button>

  <div class="panel" id="panel" role="dialog" aria-modal="false" data-i18n-label="dayDetails" aria-label="当天详情" hidden>
    <div class="panel__grip" aria-hidden="true"></div>
    <div class="panel__head">
      <div>
        <p class="panel__date" id="panel-date"></p>
        <p class="panel__meta" id="panel-meta"></p>
      </div>
      <button type="button" class="icon-btn icon-btn--sm panel__close" id="panel-close" aria-label="关闭">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="m6.5 6.5 11 11M17.5 6.5l-11 11" />
        </svg>
      </button>
    </div>
    <div class="panel__chips" id="panel-chips"></div>
    <div class="panel__body" id="panel-body"></div>
    <div class="panel__nav">
      <button type="button" class="ghost-btn" id="panel-prev">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="m14 7-5 5 5 5" />
        </svg>
        <span data-i18n="prevDay">前一天</span>
      </button>
      <button type="button" class="ghost-btn" id="panel-next">
        <span data-i18n="nextDay">后一天</span>
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="m10 7 5 5-5 5" />
        </svg>
      </button>
    </div>
  </div>
  <div class="panel-scrim" id="panel-scrim" hidden></div>

  <dialog class="dialog" id="pw-dialog">
    <form method="dialog" class="dialog__form" id="pw-form">
      <h2 class="dialog__title" data-i18n="passwordTitle">解密口令</h2>
      <p class="dialog__hint" data-i18n="passwordHint">以 <code>*</code> 开头的条目是 AES 加密的。口令只保存在本机浏览器里。</p>
      <input type="password" class="dialog__input" id="pw-input" autocomplete="current-password"
        data-i18n-placeholder="passwordPlaceholder" placeholder="输入口令" />
      <div class="dialog__actions">
        <button type="button" class="ghost-btn" id="pw-clear" data-i18n="passwordClear">清除</button>
        <span class="dialog__spacer"></span>
        <button type="button" class="ghost-btn" id="pw-cancel" data-i18n="cancel">取消</button>
        <button type="submit" class="primary-btn" id="pw-save" data-i18n="save">保存</button>
      </div>
    </form>
  </dialog>
</body>

</html>
